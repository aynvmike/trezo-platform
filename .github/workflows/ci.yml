name: CI

# Fixed 2026-08-18. The web and api jobs had never passed -- both failed
# in 8-11 seconds, which is far too fast to be a build. setup-node was
# pointed at web/package-lock.json and api/package-lock.json, and neither
# file exists: this is an npm WORKSPACES monorepo with ONE lockfile at
# the root. (web/pnpm-lock.yaml is a leftover from a pnpm experiment;
# the server builds with npm -- see ops_relay._h_web_rebuild.) So the
# jobs died at dependency caching before running a single line of code.
#
# A permanently-red check is worse than no check: it trains you to scroll
# past the X, and then the one that matters looks the same as the two
# that always fail.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  portable:
    name: Portable migration tools
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test private backup, isolated restore and disabled installation
        run: python -m unittest discover -s ops/portable -p 'test_*.py'
      - name: Install age for a real encryption round trip
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Exercise real age encryption
        if: runner.os == 'Linux'
        run: python -m unittest discover -s ops/portable -p 'test_backup.py'
      - name: Validate the pinned Supabase ports without starting containers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sh ops/self_host/prepare_official.sh 564eab8ad7840b13324f68b1bfac074ef8d51c21 "$RUNNER_TEMP/trezo-supabase"
          cp "$RUNNER_TEMP/trezo-supabase/stack/.env.example" "$RUNNER_TEMP/trezo-supabase/stack/.env"
          python ops/portable/verify_compose.py --stack "$RUNNER_TEMP/trezo-supabase/stack"
  recovery:
    name: Recovery tools (Windows PowerShell)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts and exercise read-only host inventory
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @('ops/host_preflight.ps1', 'ops/host_maintenance.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
          $report = (& ./ops/host_preflight.ps1) | ConvertFrom-Json
          if ($report.schema_version -ne 1 -or -not $report.read_only -or
              $report.decision -ne 'REVIEW_REQUIRED') {
            throw 'Read-only preflight contract failed'
          }
          if (-not $report.os -or -not $report.memory -or -not $report.fixed_disks) {
            throw 'Windows host inventory did not execute'
          }
          Write-Output 'Windows PowerShell parsing and read-only inventory passed; NSSM deployment is not exercised.'
      - name: Exercise maintenance rollback and concurrency guards
        shell: powershell
        run: ./ops/tests/test_host_maintenance.ps1
  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      # Install at the ROOT: workspaces hoist, and web's deps are not
      # resolvable from inside web/ alone.
      - run: npm install --no-audit --no-fund
      # Lint is advisory until the existing warnings are cleared -- a
      # style nit must not read the same as a broken build.
      - run: npm --workspace web run lint
        continue-on-error: true
      - run: npm --workspace web run typecheck
      - run: node --test web/tests/*.test.cjs
      - run: npm --workspace web run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "http://localhost:54321"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"

  api:
    name: API (Express)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npm --workspace api run typecheck
      - run: npm --workspace api run build

  agents:
    name: Agents (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: agents/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print('agents import ok')"
      # The guards: per-book scoping, asset policy, broker stop ratchet,
      # crypto take-profit, book gate. They run without .env, keys or
      # network by design, so CI has no excuse to skip them -- and the
      # deploy path runs the same command before it restarts the engine.
      - run: python -m tests.run_all
      - run: python -m unittest discover -s ../ops/self_host -p 'test_*.py'
