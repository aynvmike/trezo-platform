# Overlay for supabase/supabase@564eab8ad7840b13324f68b1bfac074ef8d51c21/docker.
# Docker Compose >=2.24.4: replace published ports instead of appending.
# Keep POSTGRES_PORT=5432 in the stack's .env; 54322 is a HOST port only.
services:
  api-gw:
    ports: !override
      - "127.0.0.1:54321:8000/tcp"
  db:
    ports: !override
      - "127.0.0.1:54322:5432/tcp"
  supavisor:
    ports: !reset []
