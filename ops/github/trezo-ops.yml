# Trezo ops channel -- copy of .github/workflows/trezo-ops.yml (kept here so a
# token without the `workflow` scope can still ship changes to it for review).
#
# A push to the `ops-channel` branch that touches ops/requests/current.json
# runs ops/gh_ops.py with the Supabase secrets and commits the redacted
# result to ops/results/<id>.md on the same branch. See ops/gh_ops.py.
name: Trezo ops channel

on:
  push:
    branches: [ops-channel]
    paths: ["ops/requests/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trezo-ops
  cancel-in-progress: false

jobs:
  run:
    name: Run ops request
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ops-channel
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: python ops/gh_ops.py
      - name: Commit the result
        run: |
          git config user.name "trezo-ops[bot]"
          git config user.email "trezo-ops@users.noreply.github.com"
          git add ops/results
          if git diff --cached --quiet; then
            echo "no result to commit"
          else
            git commit -m "ops result: $(ls -t ops/results | head -1) [skip ci]"
            git pull --rebase origin ops-channel || true
            git push origin HEAD:ops-channel
          fi
